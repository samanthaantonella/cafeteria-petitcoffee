<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Login Administrativo | Petit Coffee</title>

    <!-- Frameworks e Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="../static/css/admin-login.css">
</head>

<body class="admin-login-body min-vh-100 d-flex flex-column justify-content-between">

    <!-- CABEÇALHO SIMPLIFICADO -->
    <header class="site-header">
        <nav class="navbar custom-nav">
            <div class="container d-flex align-items-center justify-content-between">
                <a class="navbar-brand d-flex align-items-center gap-3" href="index.html">
                    <img src="../static/img/logooo.jpg" alt="Logo Petit Coffee" class="logo-img">
                    <span>Petit <strong>Coffee</strong></span>
                </a>
                <span class="badge bg-danger fs-6 px-3 py-2">Portal Interno</span>
            </div>
        </nav>
    </header>

    <!-- FORMULÁRIO DE LOGIN ADMINISTRATIVO -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                
                <div class="card admin-card p-4 p-sm-5 rounded-4 shadow-lg border-0">
                    <div class="text-center mb-4">
                        <div class="admin-icon-box mx-auto mb-3">
                            <i class="bi bi-shield-lock-fill"></i>
                        </div>
                        <h2 class="h3 fw-bold mb-1">Acesso do Funcionário</h2>
                        <p class="text-muted small">Digite suas credenciais corporativas para acessar a gestão</p>
                    </div>

                    <!-- FORMULÁRIO DIRECIONANDO PARA GESTAO.HTML -->
                    <form action="gestao.html" method="GET" id="formAdminLogin">
                        
                        <div class="mb-3">
                            <label for="adminUser" class="form-label fw-semibold">Usuário / Matrícula</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                                <input type="text" class="form-control" id="adminUser" placeholder="Ex.: gerencia01" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="adminPass" class="form-label fw-semibold">Senha Corporativa</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                                <input type="password" class="form-control" id="adminPass" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="adminRole" class="form-label fw-semibold">Cargo / Setor</label>
                            <select class="form-select" id="adminRole" required>
                                <option value="gerente" selected>Gerente de Loja</option>
                                <option value="atendente">Atendimento / Caixa</option>
                                <option value="barista">Cozinha / Barista</option>
                            </select>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="rememberAdmin" checked>
                            <label class="form-check-label small text-muted" for="rememberAdmin">
                                Manter sessão ativa neste terminal
                            </label>
                        </div>

                        <button type="submit" class="btn btn-dark w-100 py-3 fw-bold d-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-speedometer2"></i>
                            Acessar Painel de Gestão
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <footer class="footer-petit-coffee">
        <div class="footer-container">
            <div class="footer-brand">
                <h3 class="brand-title">Petit Coffee</h3>
                <p class="brand-subtitle">Seu momento especial do dia ☕</p>
            </div>

            <div class="social-section">
                <p class="social-title">Siga a gente nas redes:</p>
                <div class="social-links">
                    <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="social-btn instagram" aria-label="Instagram">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                    </a>
                    <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" class="social-btn facebook" aria-label="Facebook">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
                    </a>
                    <a href="https://wa.me/5500000000000" target="_blank" rel="noopener noreferrer" class="social-btn whatsapp" aria-label="WhatsApp">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    </a>
                    <a href="https://tiktok.com" target="_blank" rel="noopener noreferrer" class="social-btn tiktok" aria-label="TikTok">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"></path></svg>
                    </a>
                </div>
            </div>
        </div>

        <div class="footer-bottom">
            <p>&copy; 2026 Petit Coffee. Todos os direitos reservados.</p>
        </div>
    </footer>
    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
