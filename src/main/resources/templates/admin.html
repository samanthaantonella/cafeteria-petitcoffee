
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <title>Login Administrativo | Petit Coffee</title>

    <!-- Frameworks e Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin-login.css}">
</head>

<body class="admin-login-body min-vh-100 d-flex flex-column justify-content-between">

<!-- CABEÇALHO -->
<header class="site-header">

    <nav class="navbar custom-nav">

        <div class="container d-flex align-items-center justify-content-between">

            <a class="navbar-brand d-flex align-items-center gap-3"
               th:href="@{/}"
               aria-label="Petit Coffee - início">

                <img th:src="@{/img/logooo.jpg}"
                     alt="Logo Petit Coffee"
                     class="logo-img">

                <span>Petit <strong>Coffee</strong></span>

            </a>

            <span class="badge bg-danger fs-6 px-3 py-2">
                    Portal Interno
                </span>

        </div>

    </nav>

</header>


<!-- LOGIN ADMINISTRATIVO -->
<main class="container my-5">

    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-5">

            <div class="card admin-card p-4 p-sm-5 rounded-4 shadow-lg border-0">

                <!-- ÍCONE E TÍTULO -->
                <div class="text-center mb-4">

                    <div class="admin-icon-box mx-auto mb-3">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>

                    <h2 class="h3 fw-bold mb-1">
                        Acesso do Funcionário
                    </h2>

                    <p class="text-muted small">
                        Digite suas credenciais corporativas para acessar a gestão
                    </p>

                </div>


                <!-- MENSAGENS -->
                <div th:if="${mensagemErro}"
                     class="alert alert-danger"
                     role="alert"
                     th:text="${mensagemErro}">
                </div>

                <div th:if="${mensagemSucesso}"
                     class="alert alert-success"
                     role="alert"
                     th:text="${mensagemSucesso}">
                </div>


                <!-- FORMULÁRIO -->
                <form th:action="@{/gestao/login}"
                      method="post"
                      id="formAdminLogin"
                      autocomplete="on">

                    <!-- USUÁRIO -->
                    <div class="mb-3">

                        <label for="adminUser"
                               class="form-label fw-semibold">

                            Usuário / Matrícula
                        </label>

                        <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-person-badge"></i>
                                </span>

                            <input type="text"
                                   class="form-control"
                                   id="adminUser"
                                   name="usuario"
                                   placeholder="Ex.: gerencia01"
                                   autocomplete="username"
                                   required>

                        </div>

                    </div>


                    <!-- SENHA -->
                    <div class="mb-3">

                        <label for="adminPass"
                               class="form-label fw-semibold">

                            Senha Corporativa
                        </label>

                        <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-key-fill"></i>
                                </span>

                            <input type="password"
                                   class="form-control"
                                   id="adminPass"
                                   name="senha"
                                   placeholder="Digite sua senha"
                                   autocomplete="current-password"
                                   required>

                        </div>

                    </div>


                    <!-- CARGO -->
                    <div class="mb-4">

                        <label for="adminRole"
                               class="form-label fw-semibold">

                            Cargo / Setor
                        </label>

                        <select class="form-select"
                                id="adminRole"
                                name="cargo"
                                required>

                            <option value="" disabled>
                                Selecione seu cargo
                            </option>

                            <option value="gerente" selected>
                                Gerente de Loja
                            </option>

                            <option value="atendente">
                                Atendimento / Caixa
                            </option>

                            <option value="barista">
                                Cozinha / Barista
                            </option>

                        </select>

                    </div>


                    <!-- MANTER SESSÃO -->
                    <div class="form-check mb-4">

                        <input class="form-check-input"
                               type="checkbox"
                               id="rememberAdmin"
                               name="lembrar"
                               value="true">

                        <label class="form-check-label small text-muted"
                               for="rememberAdmin">

                            Manter sessão ativa neste terminal

                        </label>

                    </div>


                    <!-- BOTÃO -->
                    <button type="submit"
                            class="btn btn-dark w-100 py-3 fw-bold d-flex align-items-center justify-content-center gap-2">

                        <i class="bi bi-speedometer2"></i>

                        Acessar Painel de Gestão

                    </button>

                </form>


                <!-- VOLTAR AO SITE -->
                <div class="text-center mt-4">

                    <a th:href="@{/}"
                       class="text-decoration-none small text-muted">

                        <i class="bi bi-arrow-left me-1"></i>
                        Voltar para o site

                    </a>

                </div>

            </div>

        </div>

    </div>

</main>


<!-- RODAPÉ -->
<footer class="footer-petit-coffee">

    <div class="footer-container">

        <div class="footer-brand">

            <h3 class="brand-title">
                Petit Coffee
            </h3>

            <p class="brand-subtitle">
                Seu momento especial do dia ☕
            </p>

        </div>


        <!-- REDES SOCIAIS -->
        <div class="social-section">

            <p class="social-title">
                Siga a gente nas redes:
            </p>

            <div class="social-links">

                <a href="https://instagram.com"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="social-btn instagram"
                   aria-label="Instagram">

                    <i class="bi bi-instagram"></i>

                </a>


                <a href="https://facebook.com"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="social-btn facebook"
                   aria-label="Facebook">

                    <i class="bi bi-facebook"></i>

                </a>


                <a href="https://wa.me/5500000000000"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="social-btn whatsapp"
                   aria-label="WhatsApp">

                    <i class="bi bi-whatsapp"></i>

                </a>


                <a href="https://tiktok.com"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="social-btn tiktok"
                   aria-label="TikTok">

                    <i class="bi bi-tiktok"></i>

                </a>

            </div>

        </div>

    </div>


    <div class="footer-bottom">

        <p>
            &copy; 2026 Petit Coffee. Todos os direitos reservados.
        </p>

    </div>

</footer>


<!-- BOOTSTRAP -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
