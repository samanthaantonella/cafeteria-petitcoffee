
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acesse sua Conta | Petit Coffee</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS DO PROJETO -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body class="auth-body d-flex flex-column min-vh-100">

<!-- CABEÇALHO -->
<header class="site-header">

    <nav class="navbar custom-nav" aria-label="Navegação principal">

        <div class="container d-flex align-items-center justify-content-between">

            <a class="navbar-brand"
               th:href="@{/}"
               aria-label="Petit Coffee - início">

                <img th:src="@{/img/logooo.jpg}"
                     alt="Logo Petit Coffee"
                     class="logo-img">

                <span>Petit <strong>Coffee</strong></span>
            </a>

            <div id="menuPrincipal">

                <ul class="nav-menu d-flex align-items-center gap-2 gap-md-3 mb-0 p-0 navbar-nav flex-row">

                    <li class="nav-item">
                        <a class="nav-link nav-btn" th:href="@{/}">
                            Início
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link nav-btn" th:href="@{/produtos}">
                            Produtos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link nav-btn" th:href="@{/pedidos}">
                            Pedidos
                        </a>
                    </li>

                    <li class="nav-item nav-auth-item">
                        <a class="nav-link nav-btn order-btn active"
                           th:href="@{/login}">
                            Login <span aria-hidden="true">↗</span>
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>
</header>


<!-- CONTEÚDO PRINCIPAL -->
<main class="auth-wrapper flex-grow-1 d-flex align-items-center justify-content-center py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-12 col-md-10 col-lg-7 col-xl-6">

                <div class="auth-card p-4 p-sm-5 rounded-4 shadow-sm border bg-white">

                    <!-- MENSAGENS DO SISTEMA -->
                    <div th:if="${mensagemSucesso}"
                         class="alert alert-success"
                         role="alert"
                         th:text="${mensagemSucesso}">
                    </div>

                    <div th:if="${mensagemErro}"
                         class="alert alert-danger"
                         role="alert"
                         th:text="${mensagemErro}">
                    </div>


                    <!-- SELETOR CLIENTE / GERENTE -->
                    <div class="btn-group w-100 mb-4"
                         role="group"
                         aria-label="Tipo de acesso">

                        <button type="button"
                                class="btn btn-outline-danger fw-bold py-2 active"
                                id="btnCliente"
                                aria-pressed="true"
                                onclick="mostrarArea('cliente')">

                            <i class="bi bi-person-fill me-1"></i>
                            Área do Cliente
                        </button>

                        <button type="button"
                                class="btn btn-outline-dark fw-bold py-2"
                                id="btnGerente"
                                aria-pressed="false"
                                onclick="mostrarArea('gerente')">

                            <i class="bi bi-shield-lock-fill me-1"></i>
                            Área do Gerente
                        </button>

                    </div>


                    <!-- ================= ÁREA DO CLIENTE ================= -->
                    <section id="secaoCliente">

                        <!-- ABAS DE LOGIN E CADASTRO -->
                        <ul class="nav nav-pills nav-justified mb-4"
                            id="authTabs"
                            role="tablist">

                            <li class="nav-item" role="presentation">

                                <button class="nav-link active fw-bold py-2"
                                        id="login-tab"
                                        data-bs-toggle="tab"
                                        data-bs-target="#loginTabContent"
                                        type="button"
                                        role="tab">

                                    Entrar
                                </button>

                            </li>

                            <li class="nav-item" role="presentation">

                                <button class="nav-link fw-bold py-2"
                                        id="register-tab"
                                        data-bs-toggle="tab"
                                        data-bs-target="#registerTabContent"
                                        type="button"
                                        role="tab">

                                    Criar Conta
                                </button>

                            </li>

                        </ul>


                        <div class="tab-content" id="authTabsContent">

                            <!-- LOGIN DO CLIENTE -->
                            <div class="tab-pane fade show active"
                                 id="loginTabContent"
                                 role="tabpanel">

                                <form id="formLoginClient"
                                      th:action="@{/login}"
                                      method="post"
                                      autocomplete="on">

                                    <div class="mb-3">

                                        <label for="loginEmail"
                                               class="form-label fw-semibold">

                                            E-mail do Cliente
                                        </label>

                                        <input type="email"
                                               class="form-control"
                                               id="loginEmail"
                                               name="email"
                                               placeholder="seu@email.com"
                                               autocomplete="email"
                                               required>

                                    </div>


                                    <div class="mb-3">

                                        <div class="d-flex justify-content-between align-items-center mb-1">

                                            <label for="loginSenha"
                                                   class="form-label fw-semibold mb-0">

                                                Senha
                                            </label>

                                            <a th:href="@{/recuperar-senha}"
                                               class="small text-decoration-none text-muted">

                                                Esqueceu?
                                            </a>

                                        </div>

                                        <input type="password"
                                               class="form-control"
                                               id="loginSenha"
                                               name="senha"
                                               placeholder="Digite sua senha"
                                               autocomplete="current-password"
                                               required>

                                    </div>


                                    <button type="submit"
                                            class="btn btn-coffee w-100 py-3 fw-bold mt-2">

                                        Entrar como Cliente
                                    </button>

                                </form>

                            </div>


                            <!-- CADASTRO DO CLIENTE -->
                            <div class="tab-pane fade"
                                 id="registerTabContent"
                                 role="tabpanel">

                                <form id="formRegisterClient"
                                      th:action="@{/cadastro}"
                                      method="post"
                                      autocomplete="on">

                                    <div class="mb-2">

                                        <label for="regNome"
                                               class="form-label fw-semibold small mb-1">

                                            Nome Completo
                                        </label>

                                        <input type="text"
                                               class="form-control"
                                               id="regNome"
                                               name="nome"
                                               placeholder="Seu nome completo"
                                               autocomplete="name"
                                               required>

                                    </div>


                                    <div class="mb-2">

                                        <label for="regEmail"
                                               class="form-label fw-semibold small mb-1">

                                            E-mail
                                        </label>

                                        <input type="email"
                                               class="form-control"
                                               id="regEmail"
                                               name="email"
                                               placeholder="seu@email.com"
                                               autocomplete="email"
                                               required>

                                    </div>


                                    <div class="row g-2 mb-2">

                                        <div class="col-12 col-sm-6">

                                            <label for="regTel"
                                                   class="form-label fw-semibold small mb-1">

                                                Telefone / WhatsApp
                                            </label>

                                            <input type="tel"
                                                   class="form-control"
                                                   id="regTel"
                                                   name="telefone"
                                                   placeholder="(11) 99999-9999"
                                                   autocomplete="tel"
                                                   required>

                                        </div>


                                        <div class="col-12 col-sm-6">

                                            <label for="regCPF"
                                                   class="form-label fw-semibold small mb-1">

                                                CPF
                                            </label>

                                            <input type="text"
                                                   class="form-control"
                                                   id="regCPF"
                                                   name="cpf"
                                                   placeholder="000.000.000-00"
                                                   required>

                                        </div>

                                    </div>


                                    <div class="row g-2 mb-3">

                                        <div class="col-12 col-sm-6">

                                            <label for="regSenha"
                                                   class="form-label fw-semibold small mb-1">

                                                Senha
                                            </label>

                                            <input type="password"
                                                   class="form-control"
                                                   id="regSenha"
                                                   name="senha"
                                                   placeholder="Crie uma senha"
                                                   autocomplete="new-password"
                                                   minlength="8"
                                                   required>

                                        </div>


                                        <div class="col-12 col-sm-6">

                                            <label for="regSenhaConf"
                                                   class="form-label fw-semibold small mb-1">

                                                Confirmar Senha
                                            </label>

                                            <input type="password"
                                                   class="form-control"
                                                   id="regSenhaConf"
                                                   name="confirmarSenha"
                                                   placeholder="Repita sua senha"
                                                   autocomplete="new-password"
                                                   minlength="8"
                                                   required>

                                        </div>

                                    </div>


                                    <button type="submit"
                                            class="btn btn-coffee w-100 py-3 fw-bold">

                                        Cadastrar e Entrar
                                    </button>

                                </form>

                            </div>

                        </div>

                    </section>


                    <!-- ================= ÁREA DO GERENTE ================= -->
                    <section id="secaoGerente" hidden>

                        <div class="text-center mb-4">

                            <h4 class="fw-bold text-dark mb-1">
                                Acesso Administrativo
                            </h4>

                            <p class="text-muted small">
                                Exclusivo para Gerência e Funcionários do Petit Coffee
                            </p>

                        </div>


                        <form id="formLoginGerente"
                              th:action="@{/gestao/login}"
                              method="post"
                              autocomplete="on">

                            <div class="mb-3">

                                <label for="gerenteCodigo"
                                       class="form-label fw-semibold">

                                    Código / E-mail Corporativo
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="gerenteCodigo"
                                       name="email"
                                       placeholder="gerente@petitcoffee.com"
                                       autocomplete="username"
                                       required>

                            </div>


                            <div class="mb-3">

                                <label for="gerenteSenha"
                                       class="form-label fw-semibold">

                                    Senha de Acesso
                                </label>

                                <input type="password"
                                       class="form-control"
                                       id="gerenteSenha"
                                       name="senha"
                                       placeholder="Digite sua senha"
                                       autocomplete="current-password"
                                       required>

                            </div>


                            <div class="mb-3">

                                <label for="gerenteToken"
                                       class="form-label fw-semibold">

                                    Chave do Estabelecimento
                                </label>

                                <input type="password"
                                       class="form-control"
                                       id="gerenteToken"
                                       name="token"
                                       placeholder="Código de segurança"
                                       required>

                            </div>


                            <button type="submit"
                                    class="btn btn-dark w-100 py-3 fw-bold mt-2">

                                <i class="bi bi-speedometer2 me-1"></i>
                                Acessar Painel do Gerente

                            </button>

                        </form>

                    </section>

                </div>

            </div>

        </div>

    </div>

</main>


<!-- RODAPÉ -->
<footer class="footer-petit-coffee">

    <div class="footer-container">

        <div class="footer-brand">

            <h3 class="brand-title">
                Petit Coffee
            </h3>

            <p class="brand-subtitle">
                Seu momento especial do dia ☕
            </p>

        </div>


        <div class="social-section">

            <p class="social-title">
                Siga a gente nas redes:
            </p>

            <div class="social-links">

                <a href="https://instagram.com"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="social-btn instagram"
                   aria-label="Instagram">

                    <i class="bi bi-instagram"></i>
                </a>


                <a href="https://facebook.com"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="social-btn facebook"
                   aria-label="Facebook">

                    <i class="bi bi-facebook"></i>
                </a>


                <a href="https://wa.me/5500000000000"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="social-btn whatsapp"
                   aria-label="WhatsApp">

                    <i class="bi bi-whatsapp"></i>
                </a>


                <a href="https://tiktok.com"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="social-btn tiktok"
                   aria-label="TikTok">

                    <i class="bi bi-tiktok"></i>
                </a>

            </div>

        </div>

    </div>


    <div class="footer-bottom">

        <p>
            &copy; 2026 Petit Coffee. Todos os direitos reservados.
        </p>

    </div>

</footer>


<!-- BOOTSTRAP -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>


<!-- JAVASCRIPT DA PÁGINA -->
<script>

    // Alternar entre Cliente e Gerente
    function mostrarArea(tipo) {

        const secaoCliente = document.getElementById("secaoCliente");
        const secaoGerente = document.getElementById("secaoGerente");

        const btnCliente = document.getElementById("btnCliente");
        const btnGerente = document.getElementById("btnGerente");

        if (tipo === "cliente") {

            secaoCliente.hidden = false;
            secaoGerente.hidden = true;

            btnCliente.classList.add("active");
            btnGerente.classList.remove("active");

            btnCliente.setAttribute("aria-pressed", "true");
            btnGerente.setAttribute("aria-pressed", "false");

        } else {

            secaoCliente.hidden = true;
            secaoGerente.hidden = false;

            btnGerente.classList.add("active");
            btnCliente.classList.remove("active");

            btnGerente.setAttribute("aria-pressed", "true");
            btnCliente.setAttribute("aria-pressed", "false");

        }

    }


    // Validar se as senhas do cadastro são iguais
    document.getElementById("formRegisterClient")
        .addEventListener("submit", function(event) {

            const senha = document.getElementById("regSenha").value;
            const confirmarSenha = document.getElementById("regSenhaConf").value;

            if (senha !== confirmarSenha) {

                event.preventDefault();

                alert("As senhas não coincidem. Verifique e tente novamente.");

                document.getElementById("regSenhaConf").focus();

                return;
            }

            if (senha.length < 8) {

                event.preventDefault();

                alert("A senha deve possuir pelo menos 8 caracteres.");

                document.getElementById("regSenha").focus();

            }

        });

</script>

</body>
</html>
