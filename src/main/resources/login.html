<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesse ou Crie sua Conta | Petit Coffee</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./static/css/style.css">
    <link rel="stylesheet" href="./static/css/auth.css">
</head>

<body class="auth-body d-flex flex-column min-vh-100">

    <header class="site-header">
        <nav class="navbar custom-nav" aria-label="Navegação principal">
            <div class="container d-flex align-items-center justify-content-between">
                <a class="navbar-brand" href="./index.html" aria-label="Petit Coffee - início">
    <img src="./static/img/logooo.jpg" alt="Logo Petit Coffee" class="logo-img">

                    <span>Petit <strong>Coffee</strong></span>
                </a>

                <div id="menuPrincipal">
                    <ul class="nav-menu d-flex align-items-center gap-2 gap-md-3 mb-0 p-0 navbar-nav flex-row">
                        <li class="nav-item">
                            <a class="nav-link nav-btn " href="./index.html">Início</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link nav-btn" href="./cardapio.html">Cardápio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link nav-btn " href="./pedido.html">Pedidos </a>
                        </li>
                        <li class="nav-item nav-auth-item">
                            <!-- Injetado dinamicamente via auth.js -->
                            <a class="nav-link nav-btn order-btn active" href="./login.html">Login <span aria-hidden="true">↗</span></a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- FORMULÁRIO PRINCIPAL -->
    <main class="auth-wrapper flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-10 col-lg-7 col-xl-6">
                    
                    <div class="auth-card p-4 p-sm-5 rounded-4 shadow-sm border bg-white">
                        
                        <!-- SELETOR DE ABAS (LOGIN OU CADASTRO) -->
                        <ul class="nav nav-pills nav-justified mb-4 id-tab-nav" id="authTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active fw-bold py-2" id="login-tab" data-bs-toggle="tab" data-bs-target="#loginTabContent" type="button" role="tab">Entrar</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link fw-bold py-2" id="register-tab" data-bs-toggle="tab" data-bs-target="#registerTabContent" type="button" role="tab">Criar Conta</button>
                            </li>
                        </ul>

                        <!-- BOTÕES DE LOGIN / CADASTRO SOCIAL -->
                        <div class="social-login-group mb-4">
                            <button type="button" class="btn btn-outline-secondary w-100 mb-2 d-flex align-items-center justify-content-center gap-2 py-2" onclick="simularSocialLogin('Google')">
                                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12s.7 2.3 1.9 4.7l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/></svg>
                                Continuar com o Google
                            </button>
                            <button type="button" class="btn btn-outline-dark w-100 d-flex align-items-center justify-content-center gap-2 py-2" onclick="simularSocialLogin('Apple')">
                                <svg width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M11.182.008C11.148-.03 9.923.023 8.857 1.18c-.83.896-1.3 2.15-1.14 3.273 1.156.086 2.38-.592 3.125-1.468.694-.82.91-2.022.34-2.977zM15.53 12.973c-.278.596-.61 1.143-.996 1.642-.628.814-1.42 1.63-2.484 1.63-1.023 0-1.385-.59-2.532-.59-1.167 0-1.51.58-2.522.58-1.074 0-1.856-.816-2.484-1.63-1.312-1.722-2.316-4.86-1.004-7.14.652-1.134 1.823-1.85 3.093-1.85 1.056 0 1.983.627 2.532.627.53 0 1.618-.627 2.8-.627 1.2 0 2.222.617 2.82 1.503-2.476 1.393-2.072 4.93.42 5.845z"/></svg>
                                Continuar com a Apple
                            </button>
                        </div>

                        <div class="d-flex align-items-center mb-4">
                            <hr class="flex-grow-1">
                            <span class="px-3 text-muted small">ou use seu e-mail</span>
                            <hr class="flex-grow-1">
                        </div>

                        <!-- ALERTA DE MENSAGENS -->
                        <div id="authAlert" class="alert d-none text-center py-2 fs-6" role="alert"></div>

                        <div class="tab-content" id="authTabsContent">
                            
                            <!-- ABA 1: LOGIN -->
                            <div class="tab-pane fade show active" id="loginTabContent" role="tabpanel">
                                <form id="formLoginClient" autocomplete="off">
                                    <div class="mb-3">
                                        <label for="loginEmail" class="form-label fw-semibold">E-mail</label>
                                        <input type="email" class="form-control" id="loginEmail" placeholder="seu@email.com" required>
                                    </div>
                                    <div class="mb-3">
                                        <div class="d-flex justify-content-between align-items-center mb-1">
                                            <label for="loginSenha" class="form-label fw-semibold mb-0">Senha</label>
                                            <a href="#" class="small text-decoration-none text-muted" onclick="alert('Instruções de recuperação enviadas para o e-mail informado.'); return false;">Esqueceu?</a>
                                        </div>
                                        <input type="password" class="form-control" id="loginSenha" placeholder="••••••••" required>
                                    </div>
                                    <button type="submit" class="btn btn-coffee w-100 py-3 fw-bold mt-2">Entrar na Conta</button>
                                </form>
                            </div>

                            <!-- ABA 2: CADASTRO COMPLETO DO CLIENTE -->
                            <div class="tab-pane fade" id="registerTabContent" role="tabpanel">
                                <form id="formRegisterClient" autocomplete="off">
                                    <div class="row g-2 mb-2">
                                        <div class="col-12 col-sm-6">
                                            <label class="form-label fw-semibold small mb-1">Nome Completo</label>
                                            <input type="text" class="form-control" id="regNome" placeholder="Seu Nome" required>
                                        </div>
                                        <div class="col-12 col-sm-6">
                                            <label class="form-label fw-semibold small mb-1">CPF</label>
                                            <input type="text" class="form-control" id="regCPF" placeholder="000.000.000-00" required>
                                        </div>
                                    </div>

                                    <div class="row g-2 mb-2">
                                        <div class="col-12 col-sm-6">
                                            <label class="form-label fw-semibold small mb-1">E-mail</label>
                                            <input type="email" class="form-control" id="regEmail" placeholder="seu@email.com" required>
                                        </div>
                                        <div class="col-12 col-sm-6">
                                            <label class="form-label fw-semibold small mb-1">WhatsApp / Telefone</label>
                                            <input type="tel" class="form-control" id="regTel" placeholder="(11) 99999-9999" required>
                                        </div>
                                    </div>

                                    <div class="mb-2">
                                        <label class="form-label fw-semibold small mb-1">Endereço Principal de Entrega</label>
                                        <input type="text" class="form-control" id="regEnd" placeholder="Rua, Número, Bairro, Cidade" required>
                                    </div>

                                    <div class="row g-2 mb-3">
                                        <div class="col-12 col-sm-6">
                                            <label class="form-label fw-semibold small mb-1">Criar Senha</label>
                                            <input type="password" class="form-control" id="regSenha" placeholder="••••••••" required>
                                        </div>
                                        <div class="col-12 col-sm-6">
                                            <label class="form-label fw-semibold small mb-1">Confirmar Senha</label>
                                            <input type="password" class="form-control" id="regSenhaConf" placeholder="••••••••" required>
                                        </div>
                                    </div>

                                    <div class="form-check mb-3">
                                        <input class="form-check-input" type="checkbox" id="regTermos" required>
                                        <label class="form-check-label extra-small text-muted" for="regTermos">
                                            Li e aceito os termos de uso e política de privacidade do Petit Coffee.
                                        </label>
                                    </div>

                                    <button type="submit" class="btn btn-coffee w-100 py-3 fw-bold">Cadastrar e Entrar</button>
                                </form>
                            </div>

                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
            <span class="brand-footer">Petit Coffee</span>
            <span>Feito com afeto, servido com aroma.</span>
            <span>© 2024 Petit Coffee</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
